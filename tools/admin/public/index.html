<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NijiEhon 后台</title>
  <link rel="icon" type="image/png" href="/preview/assets/favicon.png">
  <link rel="stylesheet" href="/preview/assets/fonts.css">
  <link rel="stylesheet" href="/admin.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><span>𒀭</span></span><div><strong>NijiEhon</strong><span>网站后台</span></div></div>
    <div class="top-actions">
      <a class="button secondary" href="/preview/" target="_blank" rel="noopener">预览网站</a>
      <button class="primary" id="generate" type="button" disabled>生成网站</button>
    </div>
  </header>
  <div class="workspace">
    <aside class="sidebar">
      <nav aria-label="后台模块">
        <button type="button" data-tab="products" aria-current="page">商品</button>
        <button type="button" data-tab="articles">文章</button>
        <button type="button" data-tab="poster">首页海报</button>
        <button type="button" data-tab="accounts">用户与订单</button>
      </nav>
      <div id="collection" hidden>
        <div class="list-heading"><h2 id="list-title"></h2><button id="new" type="button" aria-label="新建" title="新建">+</button></div>
        <input id="filter" type="search" placeholder="筛选内容" aria-label="筛选内容">
        <div id="records"></div>
      </div>
      <span class="local-label">仅在本机运行</span>
    </aside>
    <main id="main"><p class="placeholder">正在读取内容…</p></main>
  </div>
  <p id="status" class="status" role="status" hidden></p>
  <template id="image-field">
    <fieldset class="image-field">
      <legend></legend>
      <div class="image-shot"><img alt="" hidden><span>尚未选择图片</span></div>
      <div class="image-actions">
        <label class="button secondary upload">选择图片<input type="file" accept="image/jpeg,image/png,image/webp" aria-label="选择图片"></label>
        <button class="secondary remove-image" type="button">移除</button>
        <span class="upload-status" aria-live="polite">JPEG、PNG 或 WebP，最多 10 MB</span>
      </div>
      <input type="hidden" name="image">
    </fieldset>
  </template>
</body>
</html>
