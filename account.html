<h1>个人中心</h1>
<section class="profile">
<button id="avatar-preview" class="portrait-button" type="button" aria-label="查看和修改头像" aria-haspopup="dialog" aria-controls="avatar-dialog" aria-expanded="false"><img class="portrait" data-user-avatar src="assets/default-avatar.png" width="96" height="96" alt="用户头像"></button>
<div>
<h2 id="name">访客</h2>
<span id="email">
</span>
</div>
</section>
<dialog id="avatar-dialog" class="avatar-dialog" aria-labelledby="avatar-title">
<div class="avatar-dialog-heading"><h2 id="avatar-title">头像</h2><button id="avatar-close" class="icon-button" type="button" aria-label="关闭头像窗口" autofocus><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
<img class="avatar-large" data-user-avatar src="assets/default-avatar.png" width="256" height="256" alt="当前头像预览">
<div id="avatar-settings" hidden>
<label for="avatar-file">更换头像</label>
<input id="avatar-file" type="file" accept="image/png,image/jpeg,image/webp" aria-describedby="avatar-hint avatar-status">
<p id="avatar-hint">支持透明 PNG、JPEG 和 WebP，最大 5 MB。头像会保存到你的账号，支持跨设备使用。</p>
<p id="avatar-status" role="status"></p>
</div>
<p id="avatar-login"><a class="pill dark" href="index.html#login">登录后修改头像</a></p>
</dialog>
<details id="password-settings" class="password-settings" hidden>
<summary>设置或更改密码</summary>
<form id="password-settings-form" method="post" aria-busy="true">
<input id="password-account-email" type="hidden" name="username" autocomplete="username">
<label for="account-password">新密码（至少 8 个字符）</label>
<input id="account-password" name="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password" data-auth-control disabled>
<label for="account-password-confirm">确认新密码</label>
<input id="account-password-confirm" type="password" required minlength="8" maxlength="72" autocomplete="new-password" data-auth-control disabled>
<button type="submit" class="dark" data-auth-control disabled>保存密码</button>
<p id="password-status" class="auth-status" role="status"></p>
</form>
</details>
